[package]
name = "deskwerk-docs-layout"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deskwerk Docs layout: shaping, line breaking, tabs, lists, tables, pagination, headers/footers, hit testing"

[lints]
workspace = true

[dependencies]
deskwerk-docs-geom = { workspace = true, features = ["image"] }
deskwerk-docs-doc = { workspace = true }
deskwerk-docs-fonts = { workspace = true }
deskwerk-docs-proof = { workspace = true }
deskwerk-docs-metafile = { workspace = true }
kurbo = { workspace = true }
unicode-bidi = { workspace = true }
unicode-linebreak = { workspace = true }
unicode-segmentation = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[dev-dependencies]
deskwerk-docs-doc = { workspace = true, features = ["test-support"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# The browser clock (`SystemTime::now()`/`Instant::now()` panic on wasm32-unknown-unknown).
js-sys = "0.3"
