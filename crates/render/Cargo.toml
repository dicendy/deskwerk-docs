[package]
name = "deskwerk-docs-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deskwerk Docs rasteriser: pages and thumbnails from the layout display list (vello_cpu), PNG/JPEG export"

[lints]
workspace = true

[dependencies]
deskwerk-docs-geom = { workspace = true, features = ["image"] }
deskwerk-docs-doc = { workspace = true }
deskwerk-docs-fonts = { workspace = true }
deskwerk-docs-layout = { workspace = true }
deskwerk-docs-metafile = { workspace = true }
vello_cpu = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
