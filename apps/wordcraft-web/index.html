<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- A server's link carries its token (`?src=…&token=`): never send it on as a referrer. -->
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Deskwerk Docs</title>
  <link data-trunk rel="icon" href="../../assets/app-icon/wordcraft.ico" />
  <link data-trunk rel="rust" data-bin="wordcraft-web" data-wasm-opt="z" data-weak-refs />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #e6e6e6; }
    #wordcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #wordcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #555; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="wordcraft_canvas"></canvas>
  <div id="wordcraft_loading">Loading Deskwerk Docs&hellip;</div>
  <script>
    // The loading text in the browser's language (German, French; English stays without JS).
    (function () {
      var t = { de: "Deskwerk Docs wird geladen\u2026", fr: "Chargement de Deskwerk Docs\u2026" };
      var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
      for (var i = 0; i < langs.length; i++) {
        var l = String(langs[i]).toLowerCase().split("-")[0];
        if (l === "en") return;
        if (t[l]) {
          document.getElementById("wordcraft_loading").textContent = t[l];
          document.documentElement.lang = l;
          return;
        }
      }
    })();
  </script>
</body>
</html>
